<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - CampusFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .card-custom {
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }
        
        .form-control-custom {
            background-color: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control-custom:focus {
            background-color: #ffffff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .btn-custom {
            border-radius: 50rem;
            padding: 0.75rem 1.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(13, 110, 253, 0.3);
        }

        .nav-pills .nav-link {
            border-radius: 50rem;
            color: #6c757d;
            font-weight: 500;
        }
        
        .nav-pills .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-white text-primary rounded-circle mb-3 shadow-sm" style="width: 70px; height: 70px;">
                        <i class="bi bi-tools fs-1"></i>
                    </div>
                    <h2 class="fw-bold text-dark">CampusFix</h2>
                    <p class="text-muted">Platform Pelaporan Fasilitas Kampus</p>
                </div>

                <div class="card card-custom">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Tabs Navigasi -->
                        <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login" type="button" role="tab">Masuk</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register" type="button" role="tab">Daftar Pelapor</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabsContent">
                            
                            <!-- TAB LOGIN -->
                            <div class="tab-pane fade show active" id="login" role="tabpanel">
                                <div id="loginAlert" class="alert d-none py-2 text-center small rounded-3"></div>
                                <form id="formLogin">
                                    <div class="mb-3">
                                        <label class="form-label fw-medium text-dark">Email</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-0 rounded-start-4"><i class="bi bi-envelope text-muted"></i></span>
                                            <input type="email" class="form-control form-control-custom rounded-end-4 border-start-0" id="loginEmail" required placeholder="email@kampus.ac.id">
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-medium text-dark">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-0 rounded-start-4"><i class="bi bi-lock text-muted"></i></span>
                                            <input type="password" class="form-control form-control-custom rounded-end-4 border-start-0" id="loginPassword" required placeholder="Masukkan password">
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-custom w-100 fw-bold" id="btnLogin">Masuk</button>
                                </form>
                            </div>

                            <!-- TAB REGISTER -->
                            <div class="tab-pane fade" id="register" role="tabpanel">
                                <div id="registerAlert" class="alert d-none py-2 text-center small rounded-3"></div>
                                <form id="formRegister">
                                    <div class="mb-3">
                                        <label class="form-label fw-medium text-dark">Nama Lengkap</label>
                                        <input type="text" class="form-control form-control-custom" id="regNama" required placeholder="Nama lengkap Anda">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-medium text-dark">Email</label>
                                        <input type="email" class="form-control form-control-custom" id="regEmail" required placeholder="email@kampus.ac.id">
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-medium text-dark">Password</label>
                                        <input type="password" class="form-control form-control-custom" id="regPassword" required minlength="6" placeholder="Minimal 6 karakter">
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-custom w-100 fw-bold" id="btnRegister">Daftar Sekarang</button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
