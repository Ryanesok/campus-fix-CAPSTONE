<!-- frontend/pages/login.html -->

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Masuk - CampusFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ds-primary: #155E38;
            --ds-primary-dark: #0F4A2C;
            --ds-primary-soft: #E4F1E8;
            --ds-secondary-gold: #C59B27;
            --ds-bg-page: #F8FAFC;
            --ds-surface: #FFFFFF;
            --ds-text-main: #14261B;
            --ds-text-muted: #44574B;
            --ds-border: #D5E2DA;
            --ds-status-warning: #A8540A;
            --ds-status-done: #1B7A43;
            --ds-status-reject: #B3261E;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--ds-bg-page);
            color: var(--ds-text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }

        .navbar-campusfix {
            background-color: var(--ds-primary-dark);
        }

        .brand-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.12);
            border: 2px solid var(--ds-secondary-gold);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .campusfix-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background-color: var(--ds-primary-soft);
            color: var(--ds-primary-dark);
            font-size: 12px;
            font-weight: 700;
            padding: 0.35rem 0.85rem;
            border-radius: 6px;
        }

        .gold-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--ds-secondary-gold);
            display: inline-block;
        }
        
        .card-custom {
            background-color: var(--ds-surface);
            border: 1px solid var(--ds-border);
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(20, 38, 27, 0.05);
            overflow: hidden;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--ds-text-main);
        }

        .input-group-text-ds {
            background-color: var(--ds-primary-soft);
            border: 1.5px solid var(--ds-border);
            border-right: none;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            color: var(--ds-primary);
        }
        
        .form-control-custom {
            background-color: var(--ds-surface);
            border: 1.5px solid var(--ds-border);
            border-radius: 10px;
            padding: 0.7rem 0.95rem;
            font-size: 14px;
            color: var(--ds-text-main);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control-with-icon {
            border-left: none;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }
        
        .form-control-custom:focus {
            background-color: var(--ds-surface);
            border-color: var(--ds-primary);
            box-shadow: 0 0 0 0.2rem rgba(21, 94, 56, 0.15);
        }

        .btn-ds-primary {
            background-color: var(--ds-primary);
            border-color: var(--ds-primary);
            color: #FFFFFF;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }
        
        .btn-ds-primary:hover, .btn-ds-primary:focus {
            background-color: var(--ds-primary-dark);
            border-color: var(--ds-primary-dark);
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .nav-pills-ds {
            background-color: var(--ds-bg-page);
            padding: 0.3rem;
            border-radius: 10px;
            border: 1px solid var(--ds-border);
        }

        .nav-pills-ds .nav-link {
            border-radius: 6px;
            color: var(--ds-text-muted);
            font-size: 13px;
            font-weight: 600;
            padding: 0.55rem 1rem;
        }
        
        .nav-pills-ds .nav-link.active {
            background-color: var(--ds-primary);
            color: #FFFFFF;
        }

        .alert-ds {
            border-radius: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <nav class="navbar navbar-campusfix py-3">
        <div class="container">
            <span class="navbar-brand fw-bold text-white d-flex align-items-center mb-0" style="font-size: 16px;">
                <div class="brand-avatar me-2">
                    <i class="bi bi-tools"></i>
                </div>
                CampusFix
            </span>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="text-center mb-4">
                    <div class="campusfix-pill mb-2">
                        <span class="gold-dot"></span> PELAPORAN FASILITAS KAMPUS
                    </div>
                    <h1 class="fw-bold mb-1" style="font-size: 28px; color: var(--ds-text-main);">CampusFix</h1>
                    <p class="mb-0" style="font-size: 14px; color: var(--ds-text-muted);">Masuk menggunakan akun kampus untuk melapor atau mengelola tiket.</p>
                </div>

                <div class="card card-custom">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Tabs Navigasi -->
                        <ul class="nav nav-pills nav-pills-ds nav-justified mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login" type="button" role="tab">Masuk</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register" type="button" role="tab">Daftar Pelapor</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabsContent">
                            
                            <!-- TAB LOGIN -->
                            <div class="tab-pane fade show active" id="login" role="tabpanel">
                                <div id="loginAlert" class="alert alert-ds d-none py-2 text-center"></div>
                                <form id="formLogin">
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <div class="input-group">
                                            <span class="input-group-text input-group-text-ds"><i class="bi bi-envelope"></i></span>
                                            <input type="email" class="form-control form-control-custom form-control-with-icon" id="loginEmail" required placeholder="email@kampus.ac.id">
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text input-group-text-ds"><i class="bi bi-lock"></i></span>
                                            <input type="password" class="form-control form-control-custom form-control-with-icon" id="loginPassword" required placeholder="Masukkan password">
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-ds-primary w-100" id="btnLogin">Masuk</button>
                                </form>
                            </div>

                            <!-- TAB REGISTER -->
                            <div class="tab-pane fade" id="register" role="tabpanel">
                                <div id="registerAlert" class="alert alert-ds d-none py-2 text-center"></div>
                                <form id="formRegister">
                                    <div class="mb-3">
                                        <label class="form-label">Nama Lengkap</label>
                                        <input type="text" class="form-control form-control-custom" id="regNama" required placeholder="Nama lengkap Anda">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control form-control-custom" id="regEmail" required placeholder="email@kampus.ac.id">
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label">Password</label>
                                        <input type="password" class="form-control form-control-custom" id="regPassword" required minlength="6" placeholder="Minimal 6 karakter">
                                    </div>
                                    <button type="submit" class="btn btn-ds-primary w-100" id="btnRegister">Daftar Sekarang</button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
