<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Laporan - CampusFix</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
        }
        
        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .card-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .status-badge {
            border-radius: 50rem;
            padding: 0.4rem 1rem;
            font-weight: 500;
            font-size: 0.85rem;
        }

        .img-laporan {
            height: 180px;
            object-fit: cover;
            border-top-left-radius: 1rem;
            border-bottom-left-radius: 1rem;
        }

        @media (max-width: 767.98px) {
            .img-laporan {
                border-bottom-left-radius: 0;
                border-top-right-radius: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary d-flex align-items-center" href="../index.html">
                <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 40px; height: 40px;">
                    <i class="bi bi-tools"></i>
                </div>
                CampusFix
            </a>
            <div class="d-flex">
                <a href="../index.html" class="btn btn-primary btn-sm rounded-pill px-4 fw-medium">
                    <i class="bi bi-plus-lg me-1"></i> Laporan Baru
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mb-5" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-dark mb-0">Riwayat Laporan Saya</h4>
        </div>

        <!-- Area Data Laporan -->
        <div id="laporanContainer">
            
            <!-- Indikator Loading -->
            <div id="loadingData" class="text-center py-5 text-muted">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p>Memuat riwayat laporan...</p>
            </div>

            <!-- Tampilan Jika Data Kosong -->
            <div id="dataKosong" class="text-center py-5 d-none bg-white rounded-4 shadow-sm">
                <i class="bi bi-inbox fs-1 text-muted mb-3 d-block"></i>
                <h5 class="fw-bold text-dark">Belum Ada Laporan</h5>
                <p class="text-muted mb-4">Kamu belum pernah membuat laporan kerusakan fasilitas.</p>
                <a href="../index.html" class="btn btn-outline-primary rounded-pill px-4">Buat Laporan Pertama</a>
            </div>

            <!-- Tempat Render Card Laporan -->
            <div id="listLaporan"></div>
            
        </div>
    </div>

    <script src="../js/riwayat.js"></script> 
</body>
</html>
