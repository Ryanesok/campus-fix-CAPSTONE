<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - CampusFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
        }
        
        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .table-custom th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #495057;
            border-bottom: 2px solid #dee2e6;
        }

        .table-custom td {
            vertical-align: middle;
        }

        .status-badge {
            border-radius: 50rem;
            padding: 0.35rem 0.8rem;
            font-weight: 500;
            font-size: 0.8rem;
        }

        /* Foto di Modal */
        #modalFotoLaporan {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- Navbar Admin -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4 py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                <i class="bi bi-shield-lock-fill fs-4 me-2"></i>
                CampusFix Admin
            </a>
            <div class="d-flex">
                <button class="btn btn-light btn-sm rounded-pill px-4 fw-medium text-primary" id="btnLogout">
                    <i class="bi bi-box-arrow-right me-1"></i> Keluar
                </button>
            </div>
        </div>
    </nav>

    <!-- Konten Dashboard -->
    <div class="container-fluid px-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-dark mb-0">Kelola Laporan Masuk</h4>
            
            <!-- Filter Status -->
            <div class="d-flex align-items-center">
                <label class="me-2 fw-medium text-muted small">Filter Status:</label>
                <select class="form-select form-select-sm border-0 shadow-sm rounded-pill px-3" id="filterStatus" style="width: auto;">
                    <option value="semua">Semua Laporan</option>
                    <option value="baru">Baru</option>
                    <option value="accepted">Diproses</option>
                    <option value="completed">Selesai</option>
                    <option value="rejected">Ditolak</option>
                </select>
            </div>
        </div>

        <!-- Tabel Laporan -->
        <div class="card card-custom overflow-hidden">
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover table-custom mb-0" id="tabelLaporan">
                    <thead>
                        <tr>
                            <th class="px-4 py-3">Tanggal</th>
                            <th class="py-3">Kategori</th>
                            <th class="py-3">Lokasi</th>
                            <th class="py-3">Status</th>
                            <th class="px-4 py-3 text-end">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyLaporan">
                        <!-- Tampilan Loading -->
                        <tr id="loadingRow">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                                <br>Memuat data laporan...
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Data Kosong -->
                <div id="dataKosongRow" class="text-center py-5 d-none">
                    <i class="bi bi-inbox fs-2 text-muted mb-2 d-block"></i>
                    <p class="text-muted mb-0">Tidak ada laporan yang ditemukan.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detail & Proses Laporan -->
    <div class="modal fade" id="modalProsesLaporan" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 1rem;">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold">Detail Laporan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <!-- Kolom Foto & Info -->
                        <div class="col-md-6 mb-3 mb-md-0">
                            <img src="" id="modalFotoLaporan" class="mb-3 border" alt="Foto Rusak">
                            <div class="bg-light p-3 rounded-3">
                                <p class="mb-1 small text-muted">Kategori</p>
                                <h6 class="fw-bold text-dark mb-2" id="modalKategori">-</h6>
                                
                                <p class="mb-1 small text-muted">Lokasi</p>
                                <h6 class="fw-bold text-dark mb-2" id="modalLokasi">-</h6>
                                
                                <p class="mb-1 small text-muted">Deskripsi Kerusakan</p>
                                <p class="mb-0 small text-dark" id="modalDeskripsi">-</p>
                            </div>
                        </div>
                        
                        <!-- Kolom Aksi Admin -->
                        <div class="col-md-6">
                            <form id="formProsesLaporan">
                                <input type="hidden" id="modalReportId">
                                
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-primary">Tindakan Admin</label>
                                    <select class="form-select bg-light" id="selectTindakan" required>
                                        <option value="" disabled selected>-- Pilih Pembaruan Status --</option>
                                        <!-- Opsi accepted, completed, rejected -->
                                        <option value="accepted">Terima & Proses Laporan</option>
                                        <option value="completed">Tandai Selesai Diperbaiki</option>
                                        <option value="rejected">Tolak Laporan</option>
                                    </select>
                                </div>

                                <!-- Field Alasan Penolakan -->
                                <div class="mb-4 d-none" id="wadahAlasanTolak">
                                    <label class="form-label fw-bold text-danger">Alasan Penolakan</label>
                                    <textarea class="form-control" id="inputAlasanTolak" rows="3" placeholder="Jelaskan mengapa laporan ini tidak valid..."></textarea>
                                </div>

                                <div id="alertProses" class="alert d-none py-2 small"></div>

                                <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill mt-auto" id="btnSimpanStatus">
                                    Simpan Perubahan
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
