<!-- frontend/index.html -->

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Buat Laporan - CampusFix</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ds-primary: #155E38;
            --ds-primary-dark: #0F4A2C;
            --ds-primary-soft: #E4F1E8;
            --ds-secondary-gold: #C59B27;
            --ds-bg-page: #F8FAFC;
            --ds-surface: #FFFFFF;
            --ds-text-main: #14261B;
            --ds-text-muted: #44574B;
            --ds-border: #D5E2DA;
            --ds-status-warning: #A8540A;
            --ds-status-done: #1B7A43;
            --ds-status-reject: #B3261E;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--ds-bg-page);
            color: var(--ds-text-main);
            font-size: 14px;
        }

        /* Navbar */
        .navbar-campusfix {
            background-color: var(--ds-primary-dark);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.12);
            border: 2px solid var(--ds-secondary-gold);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-nav-outline {
            background-color: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            padding: 0.45rem 0.95rem;
        }

        .btn-nav-outline:hover {
            background-color: #FFFFFF;
            color: var(--ds-primary-dark);
        }

        .btn-nav-logout {
            background-color: var(--ds-status-reject);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            padding: 0.45rem 0.95rem;
        }

        .btn-nav-logout:hover {
            background-color: #961e18;
            color: #FFFFFF;
        }

        /* Card & Form */
        .card-custom {
            background-color: var(--ds-surface);
            border: 1px solid var(--ds-border);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(20, 38, 27, 0.04);
        }

        .icon-header-box {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background-color: var(--ds-primary-soft);
            color: var(--ds-primary);
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--ds-text-main);
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--ds-text-muted);
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--ds-text-main);
            margin-bottom: 0.5rem;
        }

        .form-control-custom, .form-select-custom {
            background-color: var(--ds-surface);
            border: 1.5px solid var(--ds-border);
            border-radius: 10px;
            padding: 0.7rem 0.95rem;
            font-size: 14px;
            color: var(--ds-text-main);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control-custom:focus, .form-select-custom:focus {
            background-color: var(--ds-surface);
            border-color: var(--ds-primary);
            box-shadow: 0 0 0 0.2rem rgba(21, 94, 56, 0.15);
        }

        #previewImage {
            max-height: 280px;
            width: 100%;
            object-fit: contain;
            background-color: var(--ds-primary-soft);
            border: 1px solid var(--ds-border);
            border-radius: 10px;
        }

        .alert-custom {
            border-radius: 10px;
            font-size: 13px;
            border: 1px solid transparent;
        }

        .alert-ds-info {
            background-color: var(--ds-primary-soft);
            border-color: #C4DFCE;
            color: var(--ds-text-main);
        }

        .alert-ds-success {
            background-color: #E7F5ED;
            border-color: #B7E0C8;
            color: var(--ds-status-done);
        }

        .alert-ds-warning {
            background-color: #FEF3E7;
            border-color: #F5D3AE;
            color: var(--ds-status-warning);
        }

        .alert-ds-danger {
            background-color: #FDECEA;
            border-color: #F5C2BE;
            color: var(--ds-status-reject);
        }

        .btn-ds-primary {
            background-color: var(--ds-primary);
            border-color: var(--ds-primary);
            color: #FFFFFF;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .btn-ds-primary:hover, .btn-ds-primary:focus {
            background-color: var(--ds-primary-dark);
            border-color: var(--ds-primary-dark);
            color: #FFFFFF;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-campusfix mb-4 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-white d-flex align-items-center mb-0" href="index.html">
                <div class="brand-avatar me-2">
                    <i class="bi bi-tools"></i>
                </div>
                <span>CampusFix</span>
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="pages/riwayat.html" class="btn btn-nav-outline">
                    <i class="bi bi-clock-history me-1"></i> Riwayat
                </a>
                <button class="btn btn-nav-logout" id="btnLogoutUtama">
                    <i class="bi bi-box-arrow-right me-1"></i> Keluar
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="card card-custom mx-auto" style="max-width: 620px;">
            <div class="card-body p-4 p-md-5">
                
                <div class="text-center mb-4 pb-3" style="border-bottom: 1px solid var(--ds-border);">
                    <div class="d-inline-flex align-items-center justify-content-center icon-header-box mb-3">
                        <i class="bi bi-tools fs-4"></i>
                    </div>
                    <h1 class="page-title mb-1">Buat Laporan Kerusakan</h1>
                    <p class="page-subtitle mb-0">Laporkan kerusakan fasilitas kampus agar segera ditindaklanjuti.</p>
                </div>

                <form id="formLaporan">
                    
                    <!-- Unggah Foto -->
                    <div class="mb-4">
                        <label for="fotoFasilitas" class="form-label">
                            <i class="bi bi-camera me-1" style="color: var(--ds-primary);"></i> 1. Unggah Foto Fasilitas
                        </label>
                        <input class="form-control form-control-custom" type="file" id="fotoFasilitas" accept="image/jpeg, image/png, image/webp" required>
                        <div class="form-text mt-1" style="font-size: 12px; color: var(--ds-text-muted);">
                            Format JPEG, PNG, atau WebP (maksimal 5 MB).
                        </div>
                        
                        <div id="previewContainer" class="mt-3 d-none text-center">
                            <img id="previewImage" alt="Preview Foto">
                            <div id="loadingAI" class="mt-3 d-none fw-semibold" style="color: var(--ds-primary); font-size: 13px;">
                                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                Menganalisis gambar dengan AI...
                            </div>
                        </div>
                    </div>

                    <!-- Konfirmasi Kategori -->
                    <div id="kategoriContainer" class="mb-4 d-none">
                        <div id="alertSaranAI" class="alert alert-custom alert-ds-info py-3 px-3 mb-3 d-none" role="alert">
                            <div class="d-flex align-items-center">
                                <i class="bi bi-robot fs-5 me-3" style="color: var(--ds-primary);"></i>
                                <span id="teksSaranAI"></span>
                            </div>
                        </div>
                        
                        <label for="kategoriFinal" class="form-label">
                            <i class="bi bi-tags me-1" style="color: var(--ds-primary);"></i> 2. Kategori Fasilitas
                        </label>
                        <select class="form-select form-select-custom" id="kategoriFinal" required>
                            <option value="" disabled selected>-- Pilih Kategori --</option>
                            <option value="AC">AC</option>
                            <option value="Kursi">Kursi</option>
                            <option value="Lampu">Lampu</option>
                            <option value="Proyektor">Proyektor</option>
                            <option value="Lainnya">Lainnya (Pilih Manual)</option>
                        </select>
                    </div>

                    <!-- Detail Kerusakan -->
                    <div id="detailContainer" class="d-none">
                        <div class="mb-3">
                            <label for="lokasi" class="form-label">
                                <i class="bi bi-geo-alt me-1" style="color: var(--ds-primary);"></i> 3. Lokasi Detail
                            </label>
                            <input type="text" class="form-control form-control-custom" id="lokasi" maxlength="255" placeholder="Contoh: Gedung A, Lantai 1, Ruang 101" required>
                        </div>
                        <div class="mb-4">
                            <label for="deskripsi" class="form-label">
                                <i class="bi bi-card-text me-1" style="color: var(--ds-primary);"></i> 4. Deskripsi Kerusakan
                            </label>
                            <textarea class="form-control form-control-custom" id="deskripsi" rows="3" maxlength="5000" placeholder="Jelaskan kondisi kerusakan yang terjadi..." required></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-ds-primary w-100 mt-1" id="btnKirim">
                            Kirim Laporan <i class="bi bi-send ms-1"></i>
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
